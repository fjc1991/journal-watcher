name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip                                  # the downloaded wheels are kept between runs (keyed on requirements.txt)
      - run: python -m pip install -r requirements.txt
      - id: pw                                        # (the browser goes with the Playwright version, which requirements.txt does not pin)
        run: echo "v=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Keep the test browser between runs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: python -m playwright install chromium     # one check opens a page to see the sign-in success banner; it is skipped when no browser is installed
      - name: Offline checks (no network, no API key)
        run: python .agents/skills/ais-journal-watcher/scripts/test_reader.py
      - name: Changing the data folder (copying one data folder into another)
        run: python .agents/skills/ais-journal-watcher/scripts/test_movehome.py
  ui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip                                  # the downloaded wheels are kept between runs (keyed on requirements.txt)
      - run: python -m pip install -r requirements.txt
      - id: pw                                        # (the browser goes with the Playwright version, which requirements.txt does not pin)
        run: echo "v=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Keep the test browser between runs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: python -m playwright install chromium
      - name: Headless-browser end-to-end suite (a fake AI provider, a throw-away copy of the project)
        env:
          JW_UI_ARTIFACTS: ${{ runner.temp }}/ui-failure
        run: python .agents/skills/ais-journal-watcher/scripts/test_ui.py
      - name: When it failed, keep what the page looked like and what the app printed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/ui-failure
